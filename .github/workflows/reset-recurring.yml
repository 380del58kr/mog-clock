name: Reset recurring tasks

on:
  schedule:
    # 매일 00:05 KST (= 15:05 UTC). 스크립트가 월요일(매주)·1일(매달)만 처리한다.
    - cron: '5 15 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto | weekly | monthly | both  (수동 실행 시 강제 초기화)'
        default: 'auto'

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Uncheck completed recurring tasks
        run: node scripts/reset-recurring.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'auto' }}
