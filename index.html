<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script>try{var m=location.search.match(/theme=(light|dark)/);if(m)document.documentElement.setAttribute("data-theme",m[1])}catch(e){}</script>
<style>
:root{--tile:#fff;--digit:#111;--ring:#2a2a2a;--mut:#9aa0b4;--mut2:#8a90a6;--track:rgba(255,255,255,.16);--acc:#8fb8ff;}
@media (prefers-color-scheme:light){:root{--tile:#1f1f23;--digit:#fff;--ring:#d8d8de;--mut:#6b7080;--mut2:#6b7080;--track:rgba(0,0,0,.1);--acc:#2f6fe4;}}
:root[data-theme=dark]{--tile:#fff;--digit:#111;--ring:#2a2a2a;--mut:#9aa0b4;--mut2:#8a90a6;--track:rgba(255,255,255,.16);--acc:#8fb8ff;}
:root[data-theme=light]{--tile:#1f1f23;--digit:#fff;--ring:#d8d8de;--mut:#6b7080;--mut2:#6b7080;--track:rgba(0,0,0,.1);--acc:#2f6fe4;}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}
body{font-family:-apple-system,"Pretendard","Malgun Gothic",sans-serif;padding:16px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:12px;min-height:100vh}
.date{font-size:12px;letter-spacing:.08em;color:var(--mut)}
.row{display:flex;align-items:center;gap:7px}
.pair{display:flex;background:var(--tile);border-radius:7px;padding:0 5px;border:2px solid var(--tile);box-shadow:0 0 0 1px var(--ring)}
.sep{display:flex;flex-direction:column;gap:9px}
.sep i{display:block;width:6px;height:6px;background:var(--tile);border-radius:1px}
.d{position:relative;width:clamp(24px,7.4vw,36px);height:clamp(40px,12vw,58px);perspective:420px;font:800 clamp(34px,10vw,52px)/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:-.02em}
.d>div{position:absolute;left:0;right:0;height:calc(50% + .5px);overflow:hidden;background:var(--tile);color:var(--digit);backface-visibility:hidden}
.t,.ft{top:0}
.b,.fb{bottom:0}
.t span,.ft span{height:200%;display:flex;align-items:center;justify-content:center}
.b span,.fb span{height:200%;margin-top:-100%;display:flex;align-items:center;justify-content:center}
.ft,.fb{display:none}
.d>.f{top:0;bottom:0;height:auto;z-index:2;display:flex;align-items:center;justify-content:center;backface-visibility:visible}
.go>.f{display:none}
.go .ft{display:block;transform-origin:50% 100%;animation:ft .24s ease-in forwards;z-index:3}
.go .fb{display:block;transform-origin:50% 0;transform:rotateX(90deg);animation:fb .24s .24s ease-out forwards;z-index:3}
@keyframes ft{to{transform:rotateX(-90deg)}}
@keyframes fb{to{transform:rotateX(0)}}
.prog{width:100%;max-width:300px;display:flex;flex-direction:column;gap:4px}
.bar{height:4px;background:var(--track);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:3px;transition:width 1s linear}
.lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--mut2)}
</style></head><body>
<div class="date" id="date"></div>
<div class="row" id="clock"></div>
<div class="prog"><div class="lbl"><span>오늘 하루</span><span id="pct"></span></div><div class="bar"><i id="fill"></i></div></div>
<script>
function mk(host,groups){
  var ds=[];
  groups.forEach(function(n,gi){
    if(gi){var s=document.createElement('div');s.className='sep';s.innerHTML='<i></i><i></i>';host.appendChild(s)}
    var p=document.createElement('div');p.className='pair';
    for(var i=0;i<n;i++){
      var d=document.createElement('div');d.className='d';d.dataset.v='0';
      d.innerHTML='<div class="f"><span>0</span></div><div class="t"><span>0</span></div><div class="b"><span>0</span></div><div class="ft"><span>0</span></div><div class="fb"><span>0</span></div>';
      p.appendChild(d);ds.push(d)
    }
    host.appendChild(p)
  });
  return ds
}
function set(d,v){
  v=String(v);var old=d.dataset.v;if(old===v)return;
  d.dataset.v=v;
  d.querySelector('.f span').textContent=v;
  d.querySelector('.t span').textContent=v;
  d.querySelector('.ft span').textContent=old;
  d.querySelector('.fb span').textContent=v;
  d.classList.remove('go');void d.offsetWidth;d.classList.add('go');
  setTimeout(function(){d.querySelector('.b span').textContent=v;d.classList.remove('go')},520)
}
function put(ds,str){for(var i=0;i<ds.length;i++)set(ds[i],str.charAt(i))}
function z(n){return n<10?'0'+n:''+n}
var clk=mk(document.getElementById('clock'),[2,2,2]);
var DAYS=['일','월','화','수','목','금','토'];
var fmt=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',weekday:'short'});
var WK={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
function tick(){
  var o={};fmt.formatToParts(new Date()).forEach(function(x){o[x.type]=x.value});
  var h=+o.hour,m=+o.minute,s=+o.second;
  put(clk,z(h)+z(m)+z(s));
  document.getElementById('date').textContent=o.year+'.'+o.month+'.'+o.day+' ('+DAYS[WK[o.weekday]]+')';
  var p=(h*3600+m*60+s)/864;
  document.getElementById('fill').style.width=p+'%';
  document.getElementById('pct').textContent=Math.floor(p)+'%'
}
tick();setInterval(tick,1000);
</script></body></html>
