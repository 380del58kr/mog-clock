<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--card:#f4f4f6;--card2:#e4e4e8;--ink:#16161a;--line:#191919;--sub:#9aa0b4;--bar:#34343a;--fill:#8fb8ff}
html,body{background:#191919}
body{color:var(--sub);font-family:-apple-system,"Pretendard","Malgun Gothic",sans-serif;padding:14px 12px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:10px;min-height:100vh}
.date{font-size:12px;letter-spacing:.08em;color:var(--sub)}
.row{display:flex;align-items:center;gap:4px}
.pair{display:flex;gap:3px}
.sep{font:700 26px/1 monospace;color:#6b7190;padding:0 1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.d{position:relative;width:clamp(22px,7.2vw,40px);height:clamp(34px,11vw,60px);perspective:400px;font:700 clamp(26px,8.4vw,46px)/1 "Arial Narrow",Arial,sans-serif}
.d>div{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:var(--card);color:var(--ink);backface-visibility:hidden}
.t,.ft{top:0;border-radius:6px 6px 0 0}
.b,.fb{bottom:0;border-radius:0 0 6px 6px;background:var(--card2)}
.t span,.ft span{height:200%;display:flex;align-items:center;justify-content:center}
.b span,.fb span{height:200%;margin-top:-100%;display:flex;align-items:center;justify-content:center}
.d::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:var(--line);z-index:5}
.ft,.fb{display:none}
.go .ft{display:block;transform-origin:50% 100%;animation:ft .28s ease-in forwards;z-index:3}
.go .fb{display:block;transform-origin:50% 0;transform:rotateX(90deg);animation:fb .28s .28s ease-out forwards;z-index:3}
@keyframes ft{to{transform:rotateX(-90deg)}}
@keyframes fb{to{transform:rotateX(0)}}
.prog{width:100%;max-width:300px;display:flex;flex-direction:column;gap:4px}
.bar{height:5px;background:var(--bar);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--fill);border-radius:3px;transition:width 1s linear}
.lbl{display:flex;justify-content:space-between;font-size:11px;color:#8a90a6}
</style></head><body>
<div class="date" id="date"></div>
<div class="row" id="clock"></div>
<div class="prog"><div class="lbl"><span>오늘 하루</span><span id="pct"></span></div><div class="bar"><i id="fill"></i></div></div>
<script>
function mk(host,groups){
  var ds=[];
  groups.forEach(function(n,gi){
    if(gi){var s=document.createElement('div');s.className='sep';s.textContent=':';host.appendChild(s)}
    var p=document.createElement('div');p.className='pair';
    for(var i=0;i<n;i++){
      var d=document.createElement('div');d.className='d';d.dataset.v='0';
      d.innerHTML='<div class="t"><span>0</span></div><div class="b"><span>0</span></div><div class="ft"><span>0</span></div><div class="fb"><span>0</span></div>';
      p.appendChild(d);ds.push(d)
    }
    host.appendChild(p)
  });
  return ds
}
function set(d,v){
  v=String(v);var old=d.dataset.v;if(old===v)return;
  d.dataset.v=v;
  d.querySelector('.t span').textContent=v;
  d.querySelector('.ft span').textContent=old;
  d.querySelector('.fb span').textContent=v;
  d.classList.remove('go');void d.offsetWidth;d.classList.add('go');
  setTimeout(function(){d.querySelector('.b span').textContent=v;d.classList.remove('go')},580)
}
function put(ds,str){for(var i=0;i<ds.length;i++)set(ds[i],str.charAt(i))}
function z(n){return n<10?'0'+n:''+n}
var clk=mk(document.getElementById('clock'),[2,2,2]);
var DAYS=['일','월','화','수','목','금','토'];
var fmt=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',weekday:'short'});
var WK={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
function tick(){
  var o={};fmt.formatToParts(new Date()).forEach(function(x){o[x.type]=x.value});
  var h=+o.hour,m=+o.minute,s=+o.second;
  put(clk,z(h)+z(m)+z(s));
  document.getElementById('date').textContent=o.year+'.'+o.month+'.'+o.day+' ('+DAYS[WK[o.weekday]]+')';
  var p=(h*3600+m*60+s)/864;
  document.getElementById('fill').style.width=p+'%';
  document.getElementById('pct').textContent=Math.floor(p)+'%'
}
tick();setInterval(tick,1000);
</script></body></html>
